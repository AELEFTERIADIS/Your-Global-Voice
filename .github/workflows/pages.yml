name: Validate and publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository and history for credentials
        run: bash scripts/scan-secrets.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate generated pages and server behavior
        run: |
          npm test
          git diff --exit-code -- public/\*.css public/\*.html
      - name: Prepare public-only website artifact
        env:
          CONTACT_API_ORIGIN: https://ygvoice-contact.andyelft.workers.dev
        run: node scripts/prepare-pages.mjs "$RUNNER_TEMP/ygv-pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/ygv-pages

  responsive:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    permissions:
      contents: read
      pull-requests: read
    env:
      CHROMIUM_PATH: /usr/bin/chromium
    steps:
      - name: Install visual runtime prerequisites and fonts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl fontconfig python3 \
            fonts-liberation=1:2.1.5-3 fonts-noto-core=20201225-2 fonts-dejavu-core=2.37-8
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact baseline browser from immutable Debian archive
        run: python3 scripts/install-visual-browser.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Require human review for changed visual baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/verify-visual-review.mjs
      - name: Install locked test dependencies
        run: npm ci
      - name: Check all eight pages at all eight widths
        run: npm run test:responsive
      - name: Keep visual comparison reports for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-visual-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, responsive]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publication guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Require an approved website domain
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/validate-pages-url.mjs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
